name: Feature request
description: An idea that would make SpentSmart better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Would this need data to leave the phone? SpentSmart keeps that opt-in and minimal.
