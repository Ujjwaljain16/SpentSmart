name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Bundle (Android, Hermes)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
