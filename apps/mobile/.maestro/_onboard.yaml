# Fresh install -> past onboarding. Used by the other flows.
appId: com.ujjwaljain.spentsmart
---
- launchApp:
    clearState: true
- tapOn: "Display name"
- inputText: "Maestro"
- tapOn: "Avatar rocket"
- tapOn: "Continue"
# Payday, budget and app lock are optional; skip all three (builds before onboarding v2 don't have them).
- runFlow:
    when:
      visible: "When do you get paid?"
    commands:
      - tapOn: "Skip"
      - assertVisible: "Set a monthly budget?"
      - tapOn: "Skip"
      - assertVisible: "Lock the app?"
      - tapOn: "Skip"
- assertVisible: "hey, maestro"
