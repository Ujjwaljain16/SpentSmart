appId: com.ujjwaljain.spentsmart
name: Create a savings goal and add money to it
---
- runFlow: _onboard.yaml
- tapOn: "Budgets"
- tapOn: "Add a savings goal"
- tapOn: "Target in rupees"
- inputText: "30000"
- tapOn: "Goal name"
- inputText: "Goa trip"
- tapOn: "1 year"
- assertVisible: ".*about ₹2,500 a month.*"
- tapOn: "Create goal"
- assertVisible: "Goa trip"
- tapOn: ".*Goa trip.*Open goal"
- tapOn: "Amount in rupees"
- inputText: "5000"
- tapOn: "Add money"
- assertVisible: ".*17% saved.*|17%"
